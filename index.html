<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#0a0a0b}img{max-width:100%}</style>
<title>Match Scanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Match Scanner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: pasek marki → zakładki lig → [lista meczów | raport meczowy] → tabela → metodologia. Ciemny motyw domyślnie, jasny jako alternatywa */
:root{
  --bg:#0e1420; --panel:#151d2b; --panel2:#1b2536; --line:#263247; --fg:#e7ecf4; --muted:#8c99ad; --dim:#5d6a80;
  --home:#4c8dff; --away:#ff8a4c; --draw:#a99f86; --gold:#e3b54a;
  --good:#3fbf7f; --warn:#e3a33a; --bad:#ef6a5b; --focus:#e3b54a;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#dbe1ea; --fg:#141b27; --muted:#5a6679; --dim:#8d97a8;
  --home:#2763d6; --away:#d9632a; --draw:#8a7f62; --gold:#a87a12;
  --good:#1f8a55; --warn:#b07610; --bad:#c43d2f; --focus:#2763d6; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#dbe1ea; --fg:#141b27; --muted:#5a6679; --dim:#8d97a8;
  --home:#2763d6; --away:#d9632a; --draw:#8a7f62; --gold:#a87a12;
  --good:#1f8a55; --warn:#b07610; --bad:#c43d2f; --focus:#2763d6; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:0 0 auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.04em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.langsel{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.langsel button{border:0;background:transparent;padding:6px 10px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.langsel button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}

/* leagues */
.leagues{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.lg{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px 8px 10px;cursor:pointer;text-align:left}
.lg .fl{width:26px;height:18px;border-radius:3px;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.lg b{display:block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.lg small{color:var(--muted);font-size:11px}
.lg[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);background:var(--panel2)}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.07em;margin:0}
.ph .note{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}

/* fixtures */
.fx{list-style:none;margin:0;padding:6px;display:grid;gap:2px}
.fxb{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:10px;cursor:pointer}
.fxb:hover{background:var(--panel2)}
.fxb[aria-current="true"]{background:var(--panel2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--gold)}
.fxteams{display:grid;gap:4px;min-width:0}
.fxteam{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:13.5px}
.fxteam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxp{display:grid;grid-template-columns:repeat(3,34px);gap:3px;text-align:center;font-family:var(--mono);font-size:11.5px}
.fxp span{padding:3px 0;border-radius:4px;background:var(--bg);color:var(--muted)}
.fxp span.top{color:var(--bg);font-weight:600}
.crest{width:22px;height:22px;flex:0 0 auto}
.custom{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.custom .row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.custom .vs{color:var(--muted);font-family:var(--mono);font-size:12px}
select{width:100%;font-size:13.5px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.go{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;background:var(--gold);color:var(--bg);border:0;border-radius:6px;padding:10px;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.err{font-size:12px;color:var(--bad);min-height:1em}

/* scoreboard */
.board{padding:20px 18px 16px;display:grid;gap:16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.tm{display:flex;align-items:center;gap:12px;min-width:0}
.tm.r{flex-direction:row-reverse;text-align:right}
.tm .crest{width:56px;height:56px}
.tm .nm{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,32px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.tm .meta{font-size:12px;color:var(--muted);margin-top:4px}
.tm .dots{display:flex;gap:3px;margin-top:6px}
.tm.r .dots{justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%}
.W{background:var(--good)}.D{background:var(--draw)}.L{background:var(--bad)}
.mid{text-align:center;font-family:var(--mono)}
.mid .x{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mid b{display:block;font-size:24px;font-weight:600;white-space:nowrap}
@media (max-width:560px){.tm{flex-direction:column;align-items:flex-start;gap:6px}.tm.r{flex-direction:column;align-items:flex-end}.tm .crest{width:40px;height:40px}}
.probs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.pb .eyebrow{display:flex;justify-content:space-between;gap:6px}
.pb b{font-family:var(--mono);font-size:clamp(22px,4vw,30px);font-weight:600;display:block;line-height:1.2}
.pb small{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.pb.fav{border-color:var(--gold)}
.pb.h b{color:var(--home)}.pb.x b{color:var(--draw)}.pb.a b{color:var(--away)}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.stack i{display:block;transition:flex-basis .5s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--panel)}
.chip.good{border-color:var(--good);color:var(--good)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.gold{border-color:var(--gold);color:var(--gold)}

.body{padding:16px 18px 20px;display:grid;gap:22px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi b{font-family:var(--mono);font-size:20px;font-weight:600;display:block}
h3{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h3 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.radar svg{width:100%;max-width:340px;display:block;margin:0 auto}
.rleg{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.rleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.factors{display:grid;gap:10px}
.fac{display:grid;gap:4px}
.fac .top{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.fac .top b{font-family:var(--mono);font-weight:600}
.div{position:relative;height:8px;background:var(--panel2);border-radius:4px}
.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim)}
.div i{position:absolute;top:0;bottom:0;border-radius:4px}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;margin:0 auto;font-family:var(--mono);font-size:11.5px}
.matrix td,.matrix th{width:44px;height:34px;text-align:center;border-radius:4px;padding:0}
.matrix th{color:var(--muted);font-weight:500}
.matrix td.best{outline:2px solid var(--gold);outline-offset:-2px}
.axis{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.sc{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-family:var(--mono)}
.sc b{display:block;font-size:16px}.sc span{font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel2);min-width:0;display:grid;gap:10px;align-content:start}
.card.h{border-top:3px solid var(--home)}.card.a{border-top:3px solid var(--away)}
.card header{display:flex;align-items:center;gap:10px}
.card h4{margin:0;font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.card header small{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stats span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stats b{font-family:var(--mono);font-size:15px}
.formrow{display:flex;gap:4px}
.formrow i{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff}
.gauge{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));position:relative}
.gauge b{position:absolute;top:-4px;width:4px;height:16px;background:var(--fg);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--panel2)}
.mline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mline b{color:var(--fg);font-family:var(--mono)}
.card p{margin:0;font-size:13.5px}
.concl{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:78ch}
.concl li{padding-left:16px;position:relative}
.concl li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--gold)}

.tbl-wrap{overflow-x:auto}
table.tb{border-collapse:collapse;width:100%;font-size:13px}
.tb th,.tb td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tb .t{text-align:left}
.tb td.p{font-family:var(--mono);color:var(--muted)}
.tb tr.zt td:nth-child(2){box-shadow:inset 3px 0 var(--good)} .tb tr.zr td:nth-child(2){box-shadow:inset 3px 0 var(--bad)}
.tb .tn{display:flex;align-items:center;gap:8px;font-weight:600}
.tb .dots{display:flex;gap:3px}
.pi{display:inline-block;width:64px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
.pi i{display:block;height:100%;background:var(--gold)}
.tleg{display:flex;gap:16px;padding:10px 14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.tleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
details.method{padding:0}
details.method summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:15px}
details.method div{padding:0 14px 14px;color:var(--muted);font-size:13.5px;max-width:85ch;display:grid;gap:8px}
details.method p{margin:0}

.star{border:0;background:transparent;cursor:pointer;padding:4px;line-height:0;color:var(--dim);border-radius:6px;flex:0 0 auto}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"]{color:var(--gold)}
.star:hover{color:var(--gold)}
.lgw{flex:0 0 auto;display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding-right:4px}
.lgw .lg{border:0;background:transparent;box-shadow:none}
.lgw.on{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);background:var(--panel2)}
.lgbar{display:grid;gap:8px}
.lgtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}
.allbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.allbtn[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.allbtn svg{display:none}
.lgpanel{padding:12px;display:grid;gap:14px;max-height:min(70vh,640px);overflow:auto}
.lgph{display:flex;gap:8px;position:sticky;top:-12px;background:var(--panel);padding-block:4px;z-index:1}
.lgph input{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.lgph input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.seg1{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 12px;cursor:pointer;font-size:13px}
#lggroups{display:grid;gap:12px}
.lgg{display:grid;gap:6px}
.lggrid{display:flex;flex-wrap:wrap;gap:6px}
.nof{font-size:11px;color:var(--dim);font-style:italic}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.my{padding:10px 12px;display:grid;gap:6px}
.myrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);cursor:pointer;text-align:left;width:100%}
.myrow:hover{border-color:var(--gold)}
.myrow .lgn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.myrow .mt{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myrow .mt b{color:var(--gold)}
.mygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.fxteam .fs{color:var(--gold);font-size:12px}
.card header .star{margin-left:auto}
.instbtn{display:flex;align-items:center;gap:6px;border:0;background:var(--gold);color:var(--bg);border-radius:6px;padding:7px 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.instbtn svg{width:18px;height:18px}
.instbtn:hover{filter:brightness(1.08)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(460px,100%);max-height:100%;overflow:auto}
.mbody{padding:14px 16px 18px;display:grid;gap:14px;font-size:14px}
.mbody ol{margin:0;padding-left:20px;display:grid;gap:8px}
.mbody .tabs{display:flex;gap:6px;flex-wrap:wrap}
.mbody .tabs button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.mbody .tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mbody .note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin:0}
.mbody .ok{color:var(--good);font-weight:600}
.mkt{display:grid;gap:8px}
.mkh{display:flex;justify-content:space-between;gap:8px}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.mk{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px;background:var(--panel);display:grid;gap:1px}
.mk span{font-size:10.5px;color:var(--muted);line-height:1.25}
.mk b{font-family:var(--mono);font-size:15px;font-weight:600}
.mk i{position:absolute;left:0;bottom:0;height:2px;background:var(--gold)}
.mk.h i{background:var(--home)}.mk.a i{background:var(--away)}
.mk.h b{color:var(--home)}.mk.a b{color:var(--away)}
.livenote{font-size:12px;color:var(--muted);margin:10px 0 0;border-left:3px solid var(--line);padding-left:10px}
.live{padding:16px 18px;display:grid;gap:14px;border-bottom:1px solid var(--line);background:var(--panel)}
.lvhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lvhead h3{display:flex;align-items:center;gap:8px;justify-content:flex-start}
.live .pb small{display:block;font-size:10.5px;line-height:1.3}

/* ===== v2 shell ===== */
body{padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{padding-top:14px}
.topbar{border-bottom:0;padding-bottom:4px}
.srcpill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap}
.srcpill .d{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.srcpill.on{color:var(--fg)}.srcpill.on .d{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.srcpill.off .d{background:var(--warn)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{position:relative;display:grid;justify-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:6px 2px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center}
@media (min-width:900px){
  body{padding-block:0 40px}

  .tabs button{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13.5px}
  .tabs svg{width:18px;height:18px}
  .tabs button[aria-current="page"]{background:var(--panel2);color:var(--fg)}
  .tabs button[aria-current="page"]::after{top:auto;bottom:-6px;left:16px;right:16px}
  .tabs .badge{position:static}
}

.jl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}

.jt2 b{flex:none;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:38px;text-align:center}
.jc{flex:none;min-width:30px;text-align:center;font-weight:700;font-size:12.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line)}

.odh{margin:10px 4px 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
button.jday{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;cursor:pointer;text-align:left}
button.jday>span:first-child{display:flex;align-items:center;gap:4px}

.diag{margin:18px 4px 8px;font-size:12px;color:var(--muted)}

.pickbox.draw{border-left-color:var(--draw)}.pkd{margin-top:6px;font-size:12.5px;color:var(--draw);font-weight:600}

/* club page */
.tlink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}

.tm .nm.tlink{display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:inherit;padding:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,32px);line-height:1;text-transform:uppercase}

.crest.big{width:52px;height:52px;flex:none}

.tstats div{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.tstats small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tstats b{font-size:16px;font-variant-numeric:tabular-nums}
.tform{display:flex;align-items:center;gap:10px;padding:12px 14px 14px}.tform small{color:var(--muted);font-size:12px}
.trow{display:grid;grid-template-columns:78px 22px minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;padding:9px 14px;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}

body{background:var(--bg)}
/* day strip */
.days button{min-width:58px;border:0;background:transparent;border-radius:10px;padding:6px 8px}
.days b{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:600}

/* league blocks */
.lgsec{background:var(--panel);border:0;border-radius:14px;margin-bottom:12px}

.lgn{flex-direction:column;gap:0;align-items:flex-start}
.lgn b{font-family:var(--body);font-size:14px;font-weight:700;text-transform:none;letter-spacing:0;order:2}
.lgn small{order:1;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lgh .fl{width:24px;height:16px;border-radius:3px;box-shadow:none}
.lgc{background:var(--panel2);border-radius:99px;padding:1px 8px;font-size:11.5px}
.chev{color:var(--dim)}
/* match rows */
.mrow{grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);position:relative}
.mrow:hover{background:var(--panel2)}
.mrow.sel{box-shadow:inset 3px 0 0 var(--gold);background:var(--panel2)}
.mrow.in::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.mst{font-family:var(--body)!important;font-size:12.5px;font-weight:600;color:var(--muted)}
.mst.live{color:var(--gold)!important;font-weight:800}
.mst.live::before{background:var(--gold);width:5px;height:5px}
.mst.post{color:var(--dim)}
.mteams{gap:7px}
.mt{font-size:14.5px;font-weight:500;color:var(--fg)}
.mrow.post .mt:not(.win){color:var(--muted)}
.mt.win{font-weight:700;color:var(--fg)}
.mt .crest,.mt img.crest{width:20px;height:20px;border-radius:4px}
.mt .msc{font-family:var(--body);font-weight:800;font-size:15px;min-width:20px;color:var(--fg)}
.mrow.in .mt .msc{color:var(--gold)}
.mrow.post .mt:not(.win) .msc{color:var(--muted);font-weight:600}
/* probability pills */
.mp{grid-template-columns:repeat(3,36px);gap:4px}
.mp span{background:var(--panel2);border-radius:8px;padding:4px 0;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--muted)}
.mp em{font-size:9px;font-weight:600;color:var(--dim)}
.mp span.top{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.mp span.top em{color:var(--gold);opacity:.8}
.mp span.res{outline:0;background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--fg)}
/* filters + search */
.seg{background:var(--panel);border:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
#tq{background:var(--panel);border:1px solid var(--line);border-radius:12px}

.panel,.board{background:var(--panel);border-color:var(--line);border-radius:14px}
.srcpill.on .d{background:var(--good)}

  method:"Metodologia",methodText:["Siła ataku i obrony każdej drużyny to jej gole strzelone i stracone na mecz w stosunku do średniej ligi, wygładzone przy małej liczbie meczów. Z nich model wylicza oczekiwane gole obu stron, uwzględniając atut własnego boiska.","Wskaźnik mentalny (0–100) łączy formę z 5 ostatnich meczów (nowsze ważą więcej), trend względem średniej sezonu, bieżącą serię oraz presję tabeli: walkę o tytuł lub o utrzymanie. Różnica mentalności lekko przesuwa oczekiwane gole.","Wyniki są losowane z rozkładu Poissona z korektą Dixona-Colesa dla niskich wyników. Model nie zna kontuzji, zawieszeń, składów ani rotacji przy pucharach. Traktuj procenty jako punkt wyjścia do własnej analizy, a nie pewny typ."],

  method:"Methodology",methodText:["Each team's attack and defence strength is its goals scored and conceded per game relative to the league average, smoothed when few games have been played. From these the model derives expected goals for both sides, including home advantage.","The mentality index (0–100) combines form over the last 5 games (recent games weigh more), the trend against the season average, the current streak, and table pressure: a title race or a relegation fight. The mentality gap shifts expected goals slightly.","Scores are drawn from a Poisson distribution with a Dixon-Coles correction for low scores. The model does not know injuries, suspensions, line-ups or cup rotation. Treat the percentages as a starting point for your own analysis, not a sure pick."],

 en:{jr:{title:"Prediction journal",intro:"Every forecast is saved automatically before kick-off and settled against the result after the match. Only matches the app saw before kick-off count, so the numbers are fair.",emptyOn:"No settled predictions yet. The first ones appear after today’s matches finish.",emptyOff:"The journal works in the installed app, because it needs results from ESPN.",p7:"7 days",p30:"30 days",pAll:"All",settled:"Settled matches",hitRate:"Hit rate",hitSub:"model favourite won",pAct:"Avg. chance of result",pActSub:"what % the model gave to what happened",brier:"Brier score",brierSub:"lower is better · random 0.667",cal:"Calibration",calNote:"do the percentages tell the truth",fav:"Favourite chance",n:"Matches",expected:"Expected",actual:"Actual",calHelp:"If the model gives favourites 60%, they should win about 6 in 10. Green bar: the model is honest in this range. Red: it overrates favourites.",byConf:"By confidence",vsMarket:"Model vs market",vsHelp:"Compared on the same matches. If the model alone has a lower Brier score than the market, it has a real edge.",noVs:"Not enough matches with odds to compare.",byLg:"By league",minN:"min. 3 matches",pending:"Awaiting result",recent:"Recently settled",data:"Journal data",copy:"Export CSV",clear:"Clear journal",sure:"Delete the whole journal?",yes:"Yes, delete",no:"Cancel",local:"The journal is stored on this device only.",copied:"CSV copied to clipboard.",saved:"CSV file saved.",copyFail:"Could not copy."},pre:"Pre-match forecast",acc:(a,b)=>`Model hit rate on this day: ${a}/${b}`,statsT:"Match stats",tabsAria:"Sections",meth:["The forecast combines two sources. The statistical model rates attack and defence from the table (goals per game against the league average), form over the last 5 games, mentality and home advantage. The market is bookmaker odds turned into probabilities with the margin removed.","When both sources are available, the forecast weights the model at 45% and the market at 55%, because odds also reflect line-ups and injuries. The gap between them is the model edge: a large gap means the model sees the match differently from the bookmakers, or is missing something.","Live chances are recalculated every 30 seconds from the time left, the score and red cards. From the 10th minute the model also uses shots on target, so it reflects who is really on top.","Confidence depends on games played, how closely model and market agree, and how clear the favourite is. The percentages are an estimate, not a sure pick."],tabs:{journal:"Journal",today:"Today",live:"Live",match:"Analysis",leagues:"Leagues",favs:"Favourites"},

 de:{jr:{title:"Prognose-Tagebuch",intro:"Jede Prognose wird vor dem Anpfiff automatisch gespeichert und nach dem Spiel mit dem Ergebnis abgerechnet. Es zählen nur Spiele, die die App vor dem Anpfiff gesehen hat, die Zahlen sind also fair.",emptyOn:"Noch keine abgerechneten Prognosen. Die ersten erscheinen nach den heutigen Spielen.",emptyOff:"Das Tagebuch funktioniert in der installierten App, da es Ergebnisse von ESPN braucht.",p7:"7 Tage",p30:"30 Tage",pAll:"Alle",settled:"Abgerechnete Spiele",hitRate:"Trefferquote",hitSub:"Modellfavorit gewann",pAct:"Ø Chance des Ergebnisses",pActSub:"wie viel % das Modell dem Eingetretenen gab",brier:"Brier-Score",brierSub:"niedriger ist besser · Zufall 0,667",cal:"Kalibrierung",calNote:"stimmen die Prozente",fav:"Chance des Favoriten",n:"Spiele",expected:"Erwartet",actual:"Tatsächlich",calHelp:"Gibt das Modell Favoriten 60 %, sollten sie etwa 6 von 10 Spielen gewinnen. Grüner Balken: Das Modell ist in diesem Bereich ehrlich. Rot: Es überschätzt Favoriten.",byConf:"Nach Sicherheit",vsMarket:"Modell gegen Markt",vsHelp:"Vergleich auf denselben Spielen. Hat das Modell allein einen niedrigeren Brier-Score als der Markt, hat es einen echten Vorteil.",noVs:"Zu wenige Spiele mit Quoten für einen Vergleich.",byLg:"Nach Ligen",minN:"min. 3 Spiele",pending:"Warten auf Ergebnis",recent:"Zuletzt abgerechnet",data:"Tagebuchdaten",copy:"CSV exportieren",clear:"Tagebuch löschen",sure:"Gesamtes Tagebuch löschen?",yes:"Ja, löschen",no:"Abbrechen",local:"Das Tagebuch ist nur auf diesem Gerät gespeichert.",copied:"CSV in die Zwischenablage kopiert.",saved:"CSV-Datei gespeichert.",copyFail:"Kopieren fehlgeschlagen."},pre:"Prognose vor dem Spiel",acc:(a,b)=>`Trefferquote des Modells an diesem Tag: ${a}/${b}`,statsT:"Spielstatistik",tabsAria:"Bereiche",meth:["Die Prognose verbindet zwei Quellen. Das statistische Modell bewertet Angriff und Abwehr aus der Tabelle (Tore pro Spiel im Verhältnis zum Ligaschnitt), die Form der letzten 5 Spiele, die Mentalität und den Heimvorteil. Der Markt sind Buchmacherquoten, umgerechnet in Wahrscheinlichkeiten ohne Marge.","Liegen beide Quellen vor, gewichtet die Prognose das Modell mit 45 % und den Markt mit 55 %, da Quoten auch Aufstellungen und Verletzungen berücksichtigen. Die Differenz ist der Modellvorteil: Eine große Differenz bedeutet, dass das Modell das Spiel anders sieht als die Buchmacher oder etwas nicht weiß.","Live werden die Chancen alle 30 Sekunden aus Restzeit, Spielstand und Roten Karten neu berechnet. Ab der 10. Minute nutzt das Modell auch Schüsse aufs Tor und zeigt so, wer wirklich überlegen ist.","Die Sicherheit hängt von der Zahl der Spiele, der Übereinstimmung von Modell und Markt und der Deutlichkeit des Favoriten ab. Die Prozente sind eine Schätzung, kein sicherer Tipp."],tabs:{journal:"Tagebuch",today:"Heute",live:"Live",match:"Analyse",leagues:"Ligen",favs:"Favoriten"},

 es:{jr:{title:"Diario de pronósticos",intro:"Cada pronóstico se guarda automáticamente antes del inicio y se liquida con el resultado al terminar. Solo cuentan los partidos que la app vio antes del inicio, así que las cifras son justas.",emptyOn:"Aún no hay pronósticos liquidados. Los primeros aparecerán cuando terminen los partidos de hoy.",emptyOff:"El diario funciona en la app instalada, porque necesita resultados de ESPN.",p7:"7 días",p30:"30 días",pAll:"Todo",settled:"Partidos liquidados",hitRate:"Aciertos",hitSub:"ganó el favorito del modelo",pAct:"Prob. media del resultado",pActSub:"qué % dio el modelo a lo que pasó",brier:"Puntuación Brier",brierSub:"más bajo es mejor · azar 0,667",cal:"Calibración",calNote:"si los porcentajes dicen la verdad",fav:"Prob. del favorito",n:"Partidos",expected:"Esperada",actual:"Real",calHelp:"Si el modelo da a los favoritos un 60%, deberían ganar unos 6 de cada 10. Barra verde: el modelo es fiel en este rango. Roja: sobrevalora a los favoritos.",byConf:"Según confianza",vsMarket:"Modelo contra mercado",vsHelp:"Comparación en los mismos partidos. Si el modelo solo tiene un Brier más bajo que el mercado, aporta una ventaja real.",noVs:"Pocos partidos con cuotas para comparar.",byLg:"Por ligas",minN:"mín. 3 partidos",pending:"Esperando resultado",recent:"Liquidados recientemente",data:"Datos del diario",copy:"Exportar CSV",clear:"Borrar diario",sure:"¿Borrar todo el diario?",yes:"Sí, borrar",no:"Cancelar",local:"El diario se guarda solo en este dispositivo.",copied:"CSV copiado al portapapeles.",saved:"Archivo CSV guardado.",copyFail:"No se pudo copiar."},pre:"Pronóstico previo",acc:(a,b)=>`Aciertos del modelo este día: ${a}/${b}`,statsT:"Estadísticas del partido",tabsAria:"Secciones",meth:["El pronóstico combina dos fuentes. El modelo estadístico valora ataque y defensa a partir de la tabla (goles por partido frente a la media de la liga), la forma de los últimos 5 partidos, la mentalidad y el factor campo. El mercado son las cuotas de las casas de apuestas convertidas en probabilidades sin margen.","Con ambas fuentes, el pronóstico pondera el modelo al 45% y el mercado al 55%, porque las cuotas también reflejan alineaciones y lesiones. La diferencia entre ambos es la ventaja del modelo: una diferencia grande indica que el modelo ve el partido distinto a las casas o desconoce algo.","En vivo, las probabilidades se recalculan cada 30 segundos según el tiempo restante, el marcador y las rojas. Desde el minuto 10 el modelo usa también los tiros a puerta, así refleja quién domina de verdad.","La confianza depende de los partidos jugados, de cuánto coinciden modelo y mercado y de lo claro que sea el favorito. Los porcentajes son una estimación, no una apuesta segura."],tabs:{journal:"Diario",today:"Hoy",live:"En vivo",match:"Análisis",leagues:"Ligas",favs:"Favoritos"},

function matrix(r){

  for(let i=0;i<6;i++){s+=`<tr><th>${i}</th>`;for(let j=0;j<6;j++){const p=r.g[i][j], a=(p/max)*.85+.04, c=i>j?"var(--home)":i==j?"var(--draw)":"var(--away)";

function ctxChips(x){
  const c=t().ctx, o=[];
  if(x.pos===1)o.push([c.leader,"gold"]);else if(x.topZone)o.push([c.euro,"good"]);
  if(x.relZone)o.push([c.rel,"bad"]);else if(x.nearRel)o.push([c.near,"warn"]);
  if(x.streak.type==="W"&&x.streak.len>=3)o.push([c.ws(x.streak.len),"good"]);
  if(x.streak.type==="L"&&x.streak.len>=2)o.push([c.ls(x.streak.len),"bad"]);
  if(x.momentum>.6)o.push([c.up,"good"]);else if(x.momentum<-.6)o.push([c.down,"bad"]);
  return o.map(z=>`<span class="chip ${z[1]}">${esc(z[0])}</span>`).join("");
}

  const ab=T.closest("#manual [data-act]");if(ab&&curM){const s=manState(curM.id),act=ab.dataset.act;
    if(act==="clock"){if(s.run)s.run=false;else{s.run=true;s.t0=Date.now();s.m0=s.min}}
    else if(act==="reset")Object.assign(s,{min:0,gh:0,ga:0,rh:0,ra:0,run:false,t0:0,m0:0,hist:[]});
    else{const k=act[0],sd=act[1],inc=act[2]==="+"?1:-1,key=(k==="g"?"g":"r")+(sd==="h"?"h":"a");s[key]=Math.max(0,Math.min(k==="g"?15:3,s[key]+inc))}

document.addEventListener("input",e=>{if(e.target.id==="tq")renderTodayList();else if(e.target.id==="lgq")renderLgList();else if(e.target.id==="lvslider"&&curM){const s=manState(curM.id);s.min=+e.target.value;if(s.run){s.t0=Date.now();s.m0=s.min}const b=document.querySelector('label[for="lvslider"] b');if(b)b.textContent=s.min+"'"}});

async function init(){loadFav();loadLog();try{const s=localStorage.getItem("skaner-lang");if(s&&I18N[s])lang=s;else{const n=(navigator.language||"pl").slice(0,2);if(I18N[n])lang=n}}catch(e){}
  setupPWA();renderChromeAll();const h=location.hash.slice(1);setView(VIEWS.includes(h)?h:"today",false);
  await start()}
async function start(){if(FEED)return;loadingDay=true;
  const ok=await loadDay(0);                       /* ESPN first: sets ONLINE as soon as any league answers */
  if(!ok&&ESPNOK!==true){ESPNOK=false;SB.delete(ymd(dayDate(0)));
    const tl=await tsGet(`eventsday.php?d=${ymd(dayDate(0)).replace(/(\d{4})(\d\d)(\d\d)/,"$1-$2-$3")}&s=Soccer`,10*60e3);if(tl!==null){ONLINE=true;await loadDay(0)}else{ESPNOK=null;ONLINE=FEED?true:false}}
  loadingDay=false;renderChromeAll();await goOnline()}
const IN_CLAUDE=(()=>{try{return !!window.claude||window.top!==window.self||/claude/.test(location.hostname)}catch(e){return true}})();

    const M=SB.get(ymd(dayDate(0)));await pool([...M.entries()].filter(([c,l])=>l.length&&LEAGUES[c]).sort((a,b)=>lgRank(a[0])-lgRank(b[0])).map(([c])=>c),3,loadStand);

/* ---- Hourly data feed (written by a Claude scheduled task into this artifact's db) ---- */
var FEEDT={pl:{pill:"Dane · co godzinę",upd:t=>`Dane z ${t} · aktualizacja co godzinę`,old:"dane mogą być nieaktualne"},
 en:{pill:"Data · hourly",upd:t=>`Data from ${t} · updated hourly`,old:"data may be out of date"},
 de:{pill:"Daten · stündlich",upd:t=>`Daten von ${t} · stündliche Aktualisierung`,old:"Daten evtl. veraltet"},
 es:{pill:"Datos · cada hora",upd:t=>`Datos de ${t} · actualización cada hora`,old:"los datos pueden estar desactualizados"}};
function feedL(){return FEEDT[lang]||FEEDT.en}
function feedTxt(){const L=feedL(),u=FEED.updated,d=new Date().toDateString()===u.toDateString()?fmtTime(u):fmtDate(u.toISOString(),{day:"numeric",month:"short"})+" "+fmtTime(u);
  return esc(L.upd(d))+(Date.now()-u>3*3600e3?` · <b>${L.old}</b>`:"")}
function feedMinute(dt){const e=(Date.now()-dt)/60e3;if(e<=0)return 1;if(e<=46)return Math.ceil(e);if(e<62)return 45;return Math.min(90,Math.round(e-16))}
function applyFeed(d){if(!d||!Array.isArray(d.games)||!d.games.length)return;if(ONLINE===true&&!FEED)return;
  FEED={updated:new Date(d.updated||Date.now())};ONLINE=true;SB.clear();PRE.clear();FC.clear();TBL.clear();
  d.games.forEach(g=>{if(!g||(!LEAGUES[g.c]&&!CUPS[g.c]))return;const dt=new Date(g.t);if(isNaN(dt))return;
    const s=String(g.s||"").toLowerCase(),off=/postp|cancel|abandon|suspend|delay/.test(s);
    let state=/final|closed|complete|ended|ft/.test(s)?"post":/progress|live|half|inplay|^in$/.test(s)?"in":"pre";
    if(state==="pre"&&!off&&Date.now()-dt>15*60e3&&Date.now()-dt<130*60e3)state="in";/* kicked off since the last update */
    const ht=/half/.test(s)&&!/2nd|second/.test(s);
    let p=Array.isArray(g.p)?g.p.map(Number):null;if(p&&p.every(x=>x>=0)){const S=p[0]+p[1]+p[2];p=S>0?p.map(x=>x/S):null}else p=null;
    const odds=p&&p.every(x=>x>.005)?{H:p[0],X:p[1],A:p[2],dec:[1/p[0],1/p[1],1/p[2]],ou:null,provider:"Sportradar"}:null;
    const min=state==="post"?90:state==="in"?(ht?45:feedMinute(dt)):0;
    const m={id:"f-"+g.id,code:g.c,slug:null,date:dt,state,name:off?"STATUS_POSTPONED":ht&&state==="in"?"STATUS_HALFTIME":"",clock:state==="in"?min+"'":"",minute:min,
      home:{id:"",name:String(g.h||"?"),logo:null,score:+g.hs||0},away:{id:"",name:String(g.a||"?"),logo:null,score:+g.as||0},
      odds,stats:null,details:[],reds:[+g.rh||0,+g.ra||0],venue:""};
    if(odds&&state==="pre")PRE.set(m.id,odds);
    const key=ymd(dt);if(!SB.has(key))SB.set(key,new Map());const M=SB.get(key);if(!M.has(g.c))M.set(g.c,[]);M.get(g.c).push(m)});
  SB.forEach(M=>M.forEach(l=>l.sort((a,b)=>a.date-b.date)));
  lastRef=FEED.updated;try{recordHist()}catch(e){}
  try{logMatches([].concat(dayMatches(-1),dayMatches(0)))}catch(e){}
  if(curM&&!curM.snap){const nm=findMatch(curM.id);if(nm)curM=nm}
  renderChromeAll();renderCurrent()}
(async()=>{try{if(!window.claude||typeof window.claude.use!=="function")return;const db=await window.claude.use("db");if(!db)return;
  db.doc("feed/now").onSnapshot(s=>{if(s.exists)applyFeed(s.data())},()=>{})}catch(e){}})();
